<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bordbistro – Mein Bahnjahr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 24 12 10l7 9 4-5 5 10' fill='none' stroke='%23111' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="mapmode">
  <canvas id="map" aria-label="Mein Bahnjahr 2026: alle Fahrten als Linien, die Bahnhöfe nach Besuchen"></canvas>
  <div class="fade" id="fade" aria-hidden="true"></div>

  <header class="brand">
    <h1>Bordbistro</h1>
    <p class="mono">Mein Bahnjahr 2026</p>
  </header>

  <dl class="stats" id="stats" aria-label="Das Jahr in Zahlen"></dl>

  <button type="button" class="mapbtn" id="mapbtn">Übersicht</button>

  <section class="ticket away" id="ticket" aria-live="polite">
    <div class="t-main mono" id="tmain"></div>
    <button type="button" class="t-go" id="go">Einsteigen</button>
    <div class="stamp" id="stamp" aria-hidden="true"></div>
  </section>

  <section class="year" id="year" aria-label="Das Jahr in 16 Fahrten">
    <p class="y-cap mono" id="ycap"></p>
    <div class="y-track" id="ytrack"></div>
    <div class="y-months mono" aria-hidden="true">
      <span>Jan</span><span>Feb</span><span>Mär</span><span>Apr</span><span>Mai</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Okt</span><span>Nov</span><span>Dez</span>
    </div>
  </section>

  <div class="tip" id="tip" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
