<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jonas' Bordbistro</title>
    <meta name="description" content="Alle Bahnfahrten 2026 als 3D-Karte: Je öfter eine Strecke gefahren wurde, desto höher die Linie. Mit Zeitleiste und Statistik." />
    <meta name="theme-color" content="#ec0016" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <!-- Adobe Fonts (Typekit): joc, eine runde, dicke Schrift für einzelne Wörter und das Logo (siehe --special in styles.css) -->
    <script>
      (function (d) {
        var config = { kitId: "mfc5rjo", scriptTimeout: 3000, async: true },
          h = d.documentElement,
          t = setTimeout(function () {
            h.className = h.className.replace(/\bwf-loading\b/g, "") + " wf-inactive";
          }, config.scriptTimeout),
          tk = d.createElement("script"),
          f = false,
          s = d.getElementsByTagName("script")[0],
          a;
        h.className += " wf-loading";
        tk.src = "https://use.typekit.net/" + config.kitId + ".js";
        tk.async = true;
        tk.onload = tk.onreadystatechange = function () {
          a = this.readyState;
          if (f || (a && a != "complete" && a != "loaded")) return;
          f = true;
          clearTimeout(t);
          try {
            Typekit.load(config);
          } catch (e) {}
        };
        s.parentNode.insertBefore(tk, s);
      })(document);
    </script>
    <!-- Überschriften-Schrift: Afacad Flux (selten, weich-eigenwillig, aber straff) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@500..1000&display=swap"
      rel="stylesheet"
    />
    <!-- Fließtext und Beschriftungen: Spline Sans Mono (Monospace, als Kontrast zur Überschriften-Schrift) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <!-- Schriften für die Anbieter-Kapitel: TGV inOui (Poppins) und ÖBB Railjet (Source Sans 3) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
